<script>
    function openPrefilledGoogleForm() {
        const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLScfPjq59lbltgMkC9qHELpDInYnDtwNfFFK6ZiI_oWVTaYAzw/viewform";

        // Read all inputs and trim trailing whitespace
        const data = {
            "entry.1581204807": document.getElementById('input-student-name').value.trim(),
            "entry.1405551868": document.getElementById('input-date').value.trim(),
            "entry.1589074990": document.querySelector('input[name="system"]:checked')?.value.trim() || '',
            "entry.527840182":  document.getElementById('input-proposal').value.trim(),
            "entry.1022818413": document.getElementById('input-decision').value.trim(),
            "entry.1502370520": document.querySelector('input[name="speed"]:checked')?.value.trim() || '',
            "entry.1192022819": document.getElementById('input-scenario1').value.trim(),
            "entry.1830252202": document.getElementById('input-scenario2').value.trim(),
            "entry.2070367541": document.getElementById('input-scenario3').value.trim(),
            "entry.529609879":  document.getElementById('input-pros')?.value.trim() || '',
            "entry.449117440":  document.getElementById('input-cons')?.value.trim() || '',
            "entry.881974597":  document.getElementById('input-justification').value.trim()
        };

        // Basic check so students don't submit completely blank forms
        if (!data["entry.1581204807"]) {
            alert("Please enter your name before opening the Google Form!");
            return;
        }

        // Build parameters cleanly
        const params = new URLSearchParams();
        params.append("usp", "pp_url");

        // Only attach fields that actually have text typed in
        Object.entries(data).forEach(([entryId, val]) => {
            if (val !== '') {
                params.append(entryId, val);
            }
        });

        // Open the pre-filled form in a new tab
        const prefilledUrl = `${baseUrl}?${params.toString()}`;
        window.open(prefilledUrl, '_blank');
    }
</script>
